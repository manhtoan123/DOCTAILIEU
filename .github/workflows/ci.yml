name: Local validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private-novel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private-novel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm test -- --config audit/vitest.config.ts --reporter=verbose

